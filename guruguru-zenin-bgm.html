<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ぐるぐる顔回転 + BGM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:linear-gradient(160deg,#0f0c29,#302b63,#24243e);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans",sans-serif;color:#fff;padding:16px 10px 40px;touch-action:manipulation}
header{text-align:center;margin-bottom:12px}
h1{font-size:1.35rem;margin-bottom:4px}
.subtitle{font-size:.8rem;opacity:.7}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:14px;max-width:700px;margin:0 auto}
.card{display:flex;flex-direction:column;align-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.photo-wrap{width:110px;height:110px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px rgba(255,255,255,.15),0 5px 15px rgba(0,0,0,.4);transition:box-shadow .3s;background:#222}
.card.spinning .photo-wrap{box-shadow:0 0 0 3px #ff6b6b,0 0 22px rgba(255,107,107,.6)}
.photo-wrap img{width:100%;height:100%;object-fit:cover;object-position:center center;display:block;will-change:transform}
.label{margin-top:6px;font-size:.7rem;opacity:.55;height:1em}
.card.spinning .label{opacity:1;color:#ff9ff3}
.controls{text-align:center;margin:14px 0 10px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
button{background:linear-gradient(135deg,#ff6b6b,#feca57);border:none;color:#1a1a2e;font-weight:700;font-size:.9rem;padding:11px 20px;border-radius:50px;cursor:pointer;box-shadow:0 4px 14px rgba(255,107,107,.4)}
button:active{transform:scale(.96)}
button.bgm-on{background:linear-gradient(135deg,#48dbfb,#54a0ff);color:#fff}
button.secondary{background:rgba(255,255,255,.15);color:#fff;box-shadow:none}
</style>
</head>

<p class="subtitle">顔をタップで回転・もう一度でストップ</p>

const gallery=document.getElementById("gallery"),cards=[];
const bgm = document.getElementById("bgm");
const bgmBtn = document.getElementById("bgmBtn");
let bgmPlaying = false;

imageData.forEach((src,i)=>{
  const card=document.createElement("div");
  card.className="card";
  card.innerHTML=`<div class="photo-wrap"><img src="data:image/jpeg;base64,${src}" alt="顔" draggable="false"></div><div class="label"></div>`;
  gallery.appendChild(card);
  const state={el:card,img:card.querySelector("img"),label:card.querySelector(".label"),rotation:0,speed:0,targetSpeed:0,spinning:false,raf:null};
  cards.push(state);
  const toggle=()=>{
    state.spinning=!state.spinning;
    if(state.spinning){
      state.targetSpeed=12+Math.random()*8;
      card.classList.add("spinning");
      state.label.textContent="回転中…";
      if(!state.raf)animate(state);
    }else{
      state.targetSpeed=0;
      state.label.textContent="ストップ中…";
    }
  };
  card.addEventListener("click",toggle);
  card.addEventListener("touchend",e=>{e.preventDefault();toggle()},{passive:false});
});

function animate(state){
  if(state.speed<state.targetSpeed)state.speed=Math.min(state.speed+.4,state.targetSpeed);
  else if(state.speed>state.targetSpeed)state.speed=Math.max(state.speed-.3,state.targetSpeed);
  state.rotation+=state.speed;
  state.img.style.transform=`rotate(${state.rotation}deg)`;
  if(state.speed>.05||state.targetSpeed>0)state.raf=requestAnimationFrame(()=>animate(state));
  else{state.raf=null;state.speed=0;state.el.classList.remove("spinning");state.label.textContent=""}
}

document.getElementById("spinAll").addEventListener("click",()=>{
  const any=cards.some(c=>c.spinning);
  cards.forEach(state=>{
    if(any){state.spinning=false;state.targetSpeed=0;state.label.textContent="ストップ中…"}
    else{state.spinning=true;state.targetSpeed=10+Math.random()*10;state.el.classList.add("spinning");state.label.textContent="回転中…";if(!state.raf)animate(state)}
  });
});

bgmBtn.addEventListener("click",()=>{
  if(bgmPlaying){
    bgm.pause();
    bgmBtn.textContent = "🎵 BGM OFF";
    bgmBtn.classList.remove("bgm-on");
    bgmBtn.classList.add("secondary");
  }else{
    bgm.playbackRate = 1.25;
    bgm.play().catch(e=>alert("音楽の再生に失敗しました。端末の音量設定を確認してください。"));
    bgmBtn.textContent = "🎵 BGM ON";
    bgmBtn.classList.add("bgm-on");
    bgmBtn.classList.remove("secondary");
  }
  bgmPlaying = !bgmPlaying;
});
</script>

</html>
